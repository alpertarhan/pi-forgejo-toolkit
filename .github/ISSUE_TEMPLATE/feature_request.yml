name: Feature request
description: Propose a focused Forgejo or Pi workflow improvement
title: "feature: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: forgejo-version
    attributes:
      label: Relevant Forgejo version
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal preserves server-qualified resources and credential isolation.
          required: true
        - label: I searched existing issues and pull requests.
          required: true
